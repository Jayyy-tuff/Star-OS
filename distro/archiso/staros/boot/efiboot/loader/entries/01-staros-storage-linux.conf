# Star Storage (M0.4, ADR-0011): the live system with its changes kept on the
# disk labelled STAROS_DATA, in a folder of this ISO build. Never the default:
# archiso waits 30 s and then opens an emergency shell when the disk is
# missing. scripts/build-iso.sh adds this entry; the Star Storage helper names
# it in bootctl set-oneshot and set-default.
title    Star OS live (prototype) with Star Storage (%ARCH%, UEFI)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% cow_label=STAROS_DATA cow_directory=persistent_%ARCHISO_UUID%/%ARCH%
