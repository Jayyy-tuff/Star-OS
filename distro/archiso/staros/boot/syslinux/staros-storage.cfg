# Star Storage (M0.4, ADR-0011), appended to archiso_sys-linux.cfg by
# scripts/build-iso.sh. Same parameters as the UEFI entry
# 01-staros-storage-linux.conf.
LABEL starstorage
TEXT HELP
Start Star OS and keep every change on the Star Storage disk (STAROS_DATA).
Set it up first with the Star Storage app.
ENDTEXT
MENU LABEL Star OS live (prototype) with Star Storage (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% cow_label=STAROS_DATA cow_directory=persistent_%ARCHISO_UUID%/%ARCH%
