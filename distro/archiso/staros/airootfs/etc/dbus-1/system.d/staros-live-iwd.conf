<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!-- Star OS live medium only (M0.5, ADR-0014): the live user may list and
     join Wi-Fi networks through iwd from quick settings, as iwd's own policy
     allows the wheel group. The live user already has passwordless sudo
     (ADR-0008), so this adds no power. The Phase 2 installer must not copy
     this file. -->
<busconfig>
  <policy user="liveuser">
    <allow send_destination="net.connman.iwd"/>
  </policy>
</busconfig>
