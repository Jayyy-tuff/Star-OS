<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!-- Star OS (M0.5, ADR-0016): apps that ask for "sans-serif" (Firefox and
     other GTK apps) get Inter, like the KDE apps; other fonts still fill in
     the characters Inter lacks. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>
</fontconfig>
