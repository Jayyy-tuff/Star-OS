#
# Prints facts about the package baseline for milestone M0.2
# (scripts/ci/inspect-kde.sh), and about the QEMU on the Ubuntu runners that
# boot the ISO. Used because the agent environment cannot reach Arch or KDE
# hosts directly.

name: Inspect KDE baseline

on:
  push:
    paths:
      - ".github/workflows/inspect-kde.yml"
      - "scripts/ci/inspect-kde.sh"
      - "distro/archiso/staros/packages.x86_64.append"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Prepare pinned host
        shell: bash
        env:
          STAROS_DISPOSABLE_HOST: "1"
        run: scripts/ci/prepare-arch-build-host.sh
      - name: Inspect
        shell: bash
        run: scripts/ci/inspect-kde.sh 2>&1 | tee inspect-kde.txt
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: inspect-kde
          path: inspect-kde.txt
          if-no-files-found: warn

  runner-qemu:
    runs-on: ubuntu-24.04
    steps:
      - name: QEMU on the runner
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf >/dev/null
          echo "FACT runner.qemu $(qemu-system-x86_64 --version | head -n1)"
          for dev in VGA virtio-vga virtio-serial-pci virtserialport usb-tablet; do
            echo "---- $dev"
            qemu-system-x86_64 -device "$dev,help" 2>&1 | grep -E 'xres|yres|edid|vgamem|name=|chardev|bus' | sed 's/^/    /'
          done
          echo "FACT runner.png_screendump $(qemu-system-x86_64 -help | grep -c png || true)"
          echo "FACT runner.nproc $(nproc)"
          echo "FACT runner.mem $(free -m | awk '/Mem:/{print $2}') MiB"
          df -h / | sed 's/^/    /'
